name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Create project files
        run: |
          mkdir -p app
          cat > app/build.gradle <<'EOF_FILE'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.amarshop.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.amarshop.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildFeatures { buildConfig true }
              flavorDimensions "app"
              productFlavors {
                  // ===== ইউজার/কাস্টমার অ্যাপ (ওয়েবসাইট) =====
                  site {
                      dimension "app"
                      applicationId "com.amarshop.app"
                      resValue "string", "app_name", "Amar Shop"
                      buildConfigField "String", "START_URL", "\"https://amarshop.wuaze.com/\""
                  }
                  // ===== অ্যাডমিন অ্যাপ (অ্যাডমিন প্যানেল) =====
                  admin {
                      dimension "app"
                      applicationId "com.amarshop.admin"
                      resValue "string", "app_name", "Amar Shop Admin"
                      buildConfigField "String", "START_URL", "\"https://amarshop.wuaze.com/admin/\""
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/amarshop/app
          cat > app/src/main/java/com/amarshop/app/MainActivity.java <<'EOF_FILE'
          package com.amarshop.app;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          public class MainActivity extends Activity {
              private static final int FILE_REQ = 1001;
              private WebView web;
              private SwipeRefreshLayout swipe;
              private ValueCallback<Uri[]> filePathCallback;
              private String host;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  swipe = new SwipeRefreshLayout(this);
                  web = new WebView(this);
                  swipe.addView(web);
                  setContentView(swipe);

                  host = Uri.parse(BuildConfig.START_URL).getHost();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);          // সেশন/লগইন ও সাইটের স্ক্রিপ্টের জন্য দরকার
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  swipe.setOnRefreshListener(() -> web.reload());
                  // ওয়েবপেজ উপরে স্ক্রল করা থাকলেই কেবল pull-to-refresh কাজ করবে
                  swipe.setOnChildScrollUpCallback((parent, child) -> web.getScrollY() > 0);

                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String scheme = u.getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) {
                              if (host != null && host.equals(u.getHost())) return false; // নিজের সাইট অ্যাপের ভেতরেই
                          }
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                          return true; // tel:, whatsapp:, বাইরের লিংক -> বাইরের অ্যাপে
                      }
                      @Override public void onPageStarted(WebView v, String url, Bitmap f) { swipe.setRefreshing(true); }
                      @Override public void onPageFinished(WebView v, String url) {
                          swipe.setRefreshing(false);
                          CookieManager.getInstance().flush();
                      }
                      @Override public void onReceivedError(WebView v, int code, String desc, String url) {
                          swipe.setRefreshing(false);
                          String html = "<html><body style='font-family:sans-serif;text-align:center;padding:40px;background:#FFF8E1'>"
                              + "<h2>ইন্টারনেট সংযোগ নেই</h2><p>সংযোগ ঠিক করে নিচে টানুন বা আবার চেষ্টা করুন।</p>"
                              + "<button onclick='location.href=\"" + BuildConfig.START_URL + "\"' "
                              + "style='padding:12px 24px;background:#FFC107;border:0;border-radius:8px;font-size:16px'>আবার চেষ্টা করুন</button>"
                              + "</body></html>";
                          v.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      // অ্যাডমিন প্যানেল থেকে প্রোডাক্ট/স্লাইডার ছবি আপলোডের জন্য
                      @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              startActivityForResult(p.createIntent(), FILE_REQ);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.setDownloadListener((url, ua, cd, mime, len) -> {
                      try {
                          DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                          r.setMimeType(mime);
                          r.addRequestHeader("Cookie", CookieManager.getInstance().getCookie(url));
                          r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, URLUtil.guessFileName(url, cd, mime));
                          ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(r);
                          Toast.makeText(this, "ডাউনলোড শুরু হয়েছে", Toast.LENGTH_SHORT).show();
                      } catch (Exception e) {
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                      }
                  });

                  if (b != null) web.restoreState(b); else web.loadUrl(BuildConfig.START_URL);
              }

              @Override protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FILE_REQ && filePathCallback != null) {
                      filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      filePathCallback = null;
                  } else super.onActivityResult(req, res, data);
              }

              @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }

              @Override public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF_FILE'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <!-- সাদা শপিং ব্যাগ -->
              <path android:fillColor="#FFFFFF" android:pathData="M34,42 L74,42 L78,80 L30,80 Z"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="4" android:fillColor="#00000000"
                  android:pathData="M42,42 C42,30 66,30 66,42"/>
          </vector>
          EOF_FILE
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_FILE'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'EOF_FILE'
          <resources><color name="ic_bg">#FFC107</color></resources>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF_FILE'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#FFC107</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_FILE
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AmarShopApp"
          include ':app'
          EOF_FILE
      - run: gradle assembleSiteDebug assembleAdminDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
